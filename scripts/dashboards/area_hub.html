<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poke6s Market</title>
  <link rel="icon" type="image/png" href="/images/Favidon.png" />
  <style>
    :root {
      --bg: #08111d;
      --panel: rgba(15, 25, 44, 0.9);
      --panel-hover: rgba(24, 38, 64, 0.95);
      --line: rgba(136, 162, 205, 0.2);
      --text: #eaf1ff;
      --muted: #94a7c8;
      --accent: #4da3ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 24px; line-height: 1.2; }
    .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .tool { display: block; padding: 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: background 0.15s, border-color 0.15s; }
    .tool:hover, .tool:focus-visible { background: var(--panel-hover); border-color: var(--accent); outline: none; }
    .tool strong { display: block; font-size: 17px; margin-bottom: 6px; }
    .tool span { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .missing { color: var(--muted); }
  </style>
</head>
<body>
  <div id="site-shell"></div>
  <main>
    <p class="eyebrow" id="areaLabel"></p>
    <h1 id="areaQuestion"></h1>
    <div class="tools" id="areaTools"></div>
  </main>
  <script src="/site-shell.js"></script>
  <script>
    (function () {
      const key = window.location.pathname.replace(/^\/+|\/+$/g, "");
      const area = (window.Poke6sShell.AREAS || []).find((a) => a.key === key);
      if (!area) {
        document.getElementById("areaQuestion").innerHTML = '<span class="missing">Area not found.</span>';
        return;
      }
      document.title = `${area.label} · Poke6s Market`;
      document.getElementById("areaLabel").textContent = area.label;
      document.getElementById("areaQuestion").textContent = area.question;
      const grid = document.getElementById("areaTools");
      for (const tool of area.tools) {
        const link = document.createElement("a");
        link.className = "tool";
        link.href = tool.href;
        const title = document.createElement("strong");
        title.textContent = tool.label;
        const text = document.createElement("span");
        text.textContent = tool.text;
        link.append(title, text);
        grid.appendChild(link);
      }
    })();
  </script>
</body>
</html>
