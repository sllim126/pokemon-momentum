<!doctype html>
<!--
  Embeddable price chart for one card, served at /embed/card?product=<productId||subTypeName>
  (&market=JP for Japanese, &days=90|365|730). Made for an <iframe> on someone else's page:
  the desktop app's "Embed" button copies the code. Self-contained: no site menu, no
  sign-in, no cookies; the card name links back to the card on market.poke6s.com.
  Data: /card_details (name, set, price) and /series (daily TCGplayer market prices).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Card price chart · Poke6s Market Watch</title>
  <style>
    :root { --bg: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --up: #16a34a; --down: #dc2626; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1623; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2a3c; --up: #22c55e; --down: #f87171; --accent: #60a5fa; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px 14px 8px; gap: 6px; }
    .head { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .head img { width: 36px; height: 50px; object-fit: cover; border-radius: 3px; flex: none; }
    .title { min-width: 0; flex: 1; }
    .title a { color: var(--text); font-weight: 600; text-decoration: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title a:hover { color: var(--accent); }
    .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price { text-align: right; flex: none; }
    .price strong { font-size: 18px; font-variant-numeric: tabular-nums; display: block; }
    .price span { font-size: 12px; font-variant-numeric: tabular-nums; }
    .chart { flex: 1; min-height: 80px; position: relative; }
    .chart svg { width: 100%; height: 100%; display: block; }
    .foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .foot a { color: var(--muted); }
    .msg { color: var(--muted); margin: auto; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap"><p class="msg">Loading…</p></div>
  <script>
  (function () {
    "use strict";
    const params = new URLSearchParams(location.search);
    const key = params.get("product") || "";
    const [productId, subTypeName] = key.split("||");
    const market = params.get("market") === "JP" ? "JP" : "EN";
    const categoryId = market === "JP" ? 85 : 3;
    const days = [90, 365, 730].includes(Number(params.get("days"))) ? Number(params.get("days")) : 365;
    const SITE = "https://market.poke6s.com/";
    const wrap = document.getElementById("wrap");
    const money = (v) => (Number.isFinite(v) ? `$${v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : "—");
    const el = (tag, attrs = {}, ...kids) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) if (k === "text") node.textContent = v; else node.setAttribute(k, v);
      kids.filter(Boolean).forEach((k) => node.append(k));
      return node;
    };
    const fail = (text) => wrap.replaceChildren(el("p", { class: "msg", text }));
    if (!/^\d+$/.test(productId || "") || !subTypeName) return fail("No card chosen.");

    const cardLink = `${SITE}?${new URLSearchParams({ product: key, ...(market === "JP" ? { market: "JP" } : {}) })}`;
    Promise.all([
      fetch(`/card_details?${new URLSearchParams({ productId, subTypeName, category_id: String(categoryId) })}`).then((r) => (r.ok ? r.json() : null)),
      fetch(`/series?${new URLSearchParams({ productId, subTypeName, days: String(days), category_id: String(categoryId) })}`).then((r) => (r.ok ? r.json() : null)),
    ]).then(([details, series]) => {
      const card = details?.card;
      const cols = series?.columns || [];
      const points = (series?.rows || []).map((row) => Object.fromEntries(cols.map((c, i) => [c, row[i]])))
        .map((r) => ({ date: String(r.date).slice(0, 10), price: Number(r.marketPrice ?? r.price) }))
        .filter((p) => p.price > 0);
      if (!card || points.length < 2) return fail("No price history for this card.");
      const first = points[0].price, last = points[points.length - 1].price;
      const change = (last / first - 1) * 100;
      const color = change >= 0 ? "var(--up)" : "var(--down)";
      const label = days === 90 ? "90 days" : days === 730 ? "2 years" : "1 year";
      const chart = el("div", { class: "chart" });
      wrap.replaceChildren(
        el("div", { class: "head" },
          card.imageUrl ? el("img", { src: card.imageUrl, alt: "" }) : null,
          el("div", { class: "title" },
            el("a", { href: cardLink, target: "_blank", rel: "noopener", text: card.productName || "Card" }),
            el("div", { class: "meta", text: [card.groupName, card.number, card.subTypeName].filter(Boolean).join(" · ") })),
          el("div", { class: "price" }, el("strong", { text: money(last) }),
            el("span", { style: `color:${color}`, text: `${change >= 0 ? "+" : ""}${change.toFixed(1)}% · ${label}` }))),
        chart,
        el("div", { class: "foot" },
          el("span", { text: `TCGplayer market price · to ${points[points.length - 1].date}` }),
          el("a", { href: cardLink, target: "_blank", rel: "noopener", text: "Poke6s Market Watch ↗" })));
      const draw = () => {
        const w = chart.clientWidth || 400, h = chart.clientHeight || 160, pad = 4;
        const t0 = Date.parse(points[0].date), t1 = Date.parse(points[points.length - 1].date);
        const prices = points.map((p) => p.price);
        let lo = Math.min(...prices), hi = Math.max(...prices);
        if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
        const x = (d) => pad + ((Date.parse(d) - t0) / (t1 - t0 || 1)) * (w - 2 * pad);
        const y = (v) => pad + (1 - (v - lo) / (hi - lo)) * (h - 2 * pad);
        const line = points.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.price).toFixed(1)}`).join("");
        chart.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Price over ${label}">
          <path d="${line} L${x(points[points.length - 1].date).toFixed(1)},${h} L${x(points[0].date).toFixed(1)},${h} Z" fill="${color}" opacity="0.08"/>
          <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
      };
      draw();
      window.addEventListener("resize", draw);
    }).catch(() => fail("The chart couldn't load."));
  })();
  </script>
</body>
</html>
