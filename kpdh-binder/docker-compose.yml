services:
  kpdh-binder-planner:
    build: .
    image: kpdh-binder-planner:latest
    container_name: kpdh-binder-planner
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      # Caddy proxies to this port. Do not forward 8091 on the router.
      - "8091:80"
