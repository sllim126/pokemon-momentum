server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location ~ /\. {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
    # Always revalidate the page so updates show up immediately.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /cards/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Regenerated alongside the card list, so revalidate like the page.
  location = /cards/image-sources.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
