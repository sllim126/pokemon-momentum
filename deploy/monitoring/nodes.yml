# Other machines on the network that run an exporter, for "Other machines" on the Home lab: Servers dashboard.
# install.sh copies this to /etc/prometheus/momentum_nodes.yml; Prometheus rereads it on its
# own every few minutes (no restart). How to add a machine: docs/operator_runbook.txt,
# "Monitoring", "Adding another machine".
#
# Linux, Synology (Docker) and Proxmox hosts: node-exporter on port 9100.
# Windows: windows_exporter on port 9182.
# Labels: machine (shown name), os, and role (what it is, shown as a column).
# Example:
# - targets: ["192.168.1.30:9100"]
#   labels: {machine: caddy-host, os: linux, role: web}
- targets: ["192.168.1.72:9100"]
  labels: {machine: pbs, os: linux, role: "Proxmox Backup Server"}
