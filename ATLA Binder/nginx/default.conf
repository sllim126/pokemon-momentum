server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json;

  # Hide dotfiles and the docs that live next to the card scans.
  location ~ (/\.|\.md$) {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
    # Always revalidate the page so updates show up immediately.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /cards/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Rebuilt whenever local scans change; browsers must see the new inventory.
  location = /cards/image-manifest.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
