# Included by every location: nginx drops server-level add_header lines in any
# location that sets its own headers.

# Unlisted site: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# The planner only needs its own inline code, Scrydex card images, and the Scryfall price API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.scrydex.com data:; connect-src 'self' https://api.scryfall.com; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
