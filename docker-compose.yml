services:
  pokemon-momentum:
    build: .
    container_name: pokemon-momentum
    working_dir: /app
    command: python -m uvicorn scripts.dashboards.api:app --host 0.0.0.0 --port 8001
    environment:
      POKEMON_MOMENTUM_GOOGLE_CLIENT_ID: ${POKEMON_MOMENTUM_GOOGLE_CLIENT_ID:-}
      POKEMON_MOMENTUM_PSA_ACCESS_TOKEN: ${POKEMON_MOMENTUM_PSA_ACCESS_TOKEN:-}
      POKEMON_MOMENTUM_PSA_CACHE_TTL_DAYS: ${POKEMON_MOMENTUM_PSA_CACHE_TTL_DAYS:-30}
      POKE6S_TCGCSV_USER_AGENT: ${POKE6S_TCGCSV_USER_AGENT:-}
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    stdin_open: true
    tty: true
    restart: unless-stopped

  # The poke6s.com storefront (docs/storefront_plan.md, storefront/README.md). Its own
  # container so a crash or heavy job in the market app can't take the shop down.
  # It sees only its code, the data folder read-only, and its own data/storefront folder.
  storefront:
    build: ./storefront
    container_name: poke6s-storefront
    # Run as the host user, so the database, photos and article files the store and its
    # importers write stay owned by (and editable for) the owner, not root.
    user: "${STOREFRONT_UID:-1000}:${STOREFRONT_GID:-1000}"
    working_dir: /app
    command: python -m uvicorn storefront.app.main:app --host 0.0.0.0 --port 8010
    environment:
      STOREFRONT_DATA_DIR: /app/data/storefront
      # Local address until launch; robots stay blocked until STOREFRONT_ALLOW_INDEXING=1.
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:8010}
      STOREFRONT_ALLOW_INDEXING: ${STOREFRONT_ALLOW_INDEXING:-0}
    ports:
      - "8010:8010"
    volumes:
      - ./storefront:/app/storefront
      - ./data:/app/data:ro
      - ./data/storefront:/app/data/storefront
    restart: unless-stopped
