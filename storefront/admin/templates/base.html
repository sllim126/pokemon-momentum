<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · Poke6s admin</title>
  <link rel="icon" href="/store-static/img/favicon.png">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <nav class="ps-family" aria-label="Poke6s sites">
    <a href="{{ settings.base_url }}" target="_blank" rel="noopener">Shop</a>
    <a href="{{ settings.market_base_url }}" target="_blank" rel="noopener">Market</a>
    <a href="/" aria-current="page">Admin</a>
  </nav>
  <header class="top">
    <a class="brand" href="/"><img src="/store-static/img/logo.png" alt="Poke6s" width="110" height="39"><span>Admin</span></a>
    {% if signed_in %}
    <nav aria-label="Admin">
      <a href="/" {% if active == 'overview' %}aria-current="page"{% endif %}>Overview</a>
      <a href="/orders" {% if active == 'orders' %}aria-current="page"{% endif %}>Orders</a>
      <a href="/shipping" {% if active == 'shipping' %}aria-current="page"{% endif %}>Shipping</a>
      <a href="/products" {% if active == 'products' %}aria-current="page"{% endif %}>Products</a>
      <a href="/pricing" {% if active == 'pricing' %}aria-current="page"{% endif %}>Pricing</a>
      <a href="/supplier-profitability" {% if active == 'suppliers' %}aria-current="page"{% endif %}>Suppliers</a>
    </nav>
    <div class="top-right">
      <form method="post" action="/logout">
        <input type="hidden" name="form_token" value="{{ form_token }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
